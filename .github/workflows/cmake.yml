# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]

    runs-on: ${{ matrix.os }}

    # GitHub does not mint an OIDC token for a pull request from a fork, for the same reason it
    # withholds secrets there, so coverage is measured on pushes and on pull requests opened from
    # this repository. Skipping is deliberate: a fork pull request should not show a failed check
    # for a credential GitHub was never going to issue.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

      # This is the whole configuration. covdbg asks GitHub for the token this job can mint and
      # proves which repository it runs in; a public repository is free, so there is no secret.
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup covdbg
      uses: liasoft/setup-covdbg@v1
      with:
        version: '1.5.1'

    - name: Run covdbg
      run: covdbg --version

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=cl
        -DCMAKE_C_COMPILER=cl
        -DCMAKE_BUILD_TYPE=Debug
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Debug

    # No env block, and no secret. The id-token permission above is the whole credential.
    - name: Run Coverage
      shell: pwsh
      run: |
        covdbg --config .covdbg.yaml --output .\build\Debug\test_app.covdb .\build\Debug\test_app.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        covdbg convert --format LCOV --input .\build\Debug\test_app.covdb --output .\build\Debug\test_app.lcov
        covdbg convert --format COBERTURA --input .\build\Debug\test_app.covdb --output .\build\Debug\test_app.xml

    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v6
      with:
        name: coverage-reports-${{ matrix.os }}
        path: |
          build/Debug/test_app.lcov
          build/Debug/test_app.xml